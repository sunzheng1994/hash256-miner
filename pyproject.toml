[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hash256-miner"
version = "0.1.0"
description = "Local HASH256 PoW miner (CPU/GPU) with web3.py"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HASH256 Miner" }]
dependencies = [
  "web3>=6.0.0",
  "pycryptodome>=3.20.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "tqdm>=4.66.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
gpu12 = ["cupy-cuda12x>=13.0.0"]
gpu11 = ["cupy-cuda11x>=12.0.0"]
dev = ["pytest>=8.0.0"]
remote = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.scripts]
hash256-mine = "hash256_miner.miner:app"
hash256-remote-worker = "hash256_miner.remote_worker:main"
hash256-local-ui = "hash256_miner.local_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hash256_miner = ["abi/*.json", "cuda_kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
